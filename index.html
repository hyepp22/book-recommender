<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나에게 맞는 비문학 책 찾기</title>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --primary:#3b5bdb; --primary-d:#2f49b0; --primary-l:#edf2ff; --ok:#0b7a5a;
  --l1-bg:#e6fcf5; --l1:#087f5b; --l2-bg:#e7f5ff; --l2:#1864ab; --l3-bg:#fff4e6; --l3:#c2410c;
  --danger:#c92a2a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  line-height:1.6;font-size:17px}
#app{max-width:780px;margin:0 auto;padding:16px 14px 120px}
h1{font-size:1.55rem;line-height:1.3;margin:.2rem 0 .6rem}
h2{font-size:1.2rem;margin:0 0 .3rem}
h1:focus,h2:focus{outline:none}
.lead{color:var(--muted);margin:.2rem 0 1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.banner{background:#fff9db;border:1px solid #ffe066;color:#7a5b00;border-radius:12px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}
.error{background:#fff5f5;border:1px solid #ffc9c9;color:var(--danger);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.95rem}
.hint{color:var(--muted);font-size:.92rem}
.stepper{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 14px}
.stepper li{flex:1;text-align:center;font-size:.78rem;color:var(--muted);padding:6px 2px;border-bottom:3px solid var(--line)}
.stepper li span{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--line);color:#fff;font-size:.72rem;margin-right:4px}
.stepper li.on{color:var(--primary);border-color:var(--primary);font-weight:700}
.stepper li.on span,.stepper li.done span{background:var(--primary)}
.stepper li.done{border-color:#a5b4fc;color:#4c5fc4}
.field{margin:0 0 16px}
.field>label,.field>.lab{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid #cfd4dc;border-radius:12px;font:inherit;background:#fff;color:var(--text)}
input:focus,select:focus,button:focus-visible,.book:focus-within{outline:3px solid #bac8ff;outline-offset:1px;border-color:var(--primary)}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button,.opt{min-height:48px;padding:8px 16px;border:1.5px solid #cfd4dc;background:#fff;border-radius:12px;font:inherit;cursor:pointer;color:var(--text);text-align:left}
.seg button[aria-pressed=true],.opt[aria-pressed=true]{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d);font-weight:700}
.opts{display:grid;gap:8px}
.opt small{display:block;color:var(--muted);font-weight:400}
.btn{min-height:50px;padding:10px 22px;border-radius:14px;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font:inherit;font-weight:700;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:#cfd4dc;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.actions .btn{flex:1}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #d7dbe3;border-radius:16px;padding:12px;font:inherit;cursor:pointer;min-height:112px;color:var(--text)}
.cat .ic{font-size:1.5rem;line-height:1}
.cat .nm{display:block;font-weight:700;margin:4px 0 2px}
.cat .hn{display:block;font-size:.82rem;color:var(--muted);line-height:1.4}
.cat .kd{float:right;font-size:.7rem;color:#9aa1ad}
.cat[aria-pressed=true]{border-color:var(--primary);background:var(--primary-l);box-shadow:inset 0 0 0 1px var(--primary)}
.counter{font-weight:700;color:var(--primary)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--primary-l);color:var(--primary-d);border-radius:999px;padding:6px 8px 6px 14px;font-weight:600}
.tag button{border:0;background:#fff;color:var(--primary-d);width:28px;height:28px;border-radius:50%;font-size:1rem;cursor:pointer;line-height:1}
.chip{border:1.5px dashed #b6bfd4;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:.92rem;cursor:pointer;color:#4a5568;margin:0 6px 8px 0}
.kwnote{font-size:.9rem;color:var(--ok);margin:2px 0 10px}
.kwnote.warn{color:#b45309}
.kwrow{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.kw-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.kw-head .k{font-size:1.15rem;font-weight:800}
.kw-head .c{font-size:.85rem;color:var(--muted)}
.book{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #d7dbe3;border-radius:16px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.book input{margin-top:6px;width:22px;height:22px;accent-color:var(--primary);flex:none}
.book:has(input:checked){border-color:var(--primary);background:var(--primary-l);box-shadow:inset 0 0 0 1px var(--primary)}
.book-title{font-weight:800;line-height:1.35}
.book-meta{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{font-size:.78rem;border-radius:999px;padding:2px 10px;font-weight:700}
.lv1{background:var(--l1-bg);color:var(--l1)}.lv2{background:var(--l2-bg);color:var(--l2)}.lv3{background:var(--l3-bg);color:var(--l3)}
.fit{background:#f1f3f5;color:#495057}.rel{background:#fff3bf;color:#7a5b00}
.cover{width:64px;height:90px;object-fit:cover;border-radius:6px;flex:none;background:#eef0f4;border:1px solid var(--line)}
.cover.ph{display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.book .tx{flex:1;min-width:0}
.why{display:block;font-size:.85rem;background:#f4f1ec;border-radius:10px;padding:6px 10px;margin-top:8px;color:#5b4636}
.y24{display:inline-block;margin-top:6px;font-size:.85rem;color:var(--primary-d)}
.new{background:#fff3bf;color:#7a5b00}.yt{background:#f3f0ff;color:#5f3dc4}.tch{background:#f1f3f5;color:#495057}
.spin{width:34px;height:34px;border:4px solid #dbe4ff;border-top-color:var(--primary);border-radius:50%;margin:14px 0 4px}
@media(prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-in .btn{flex:none}
.bar-in .msg{flex:1;font-size:.95rem}
.done-list{list-style:none;padding:0;margin:14px 0}
.done-list li{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:#fafbff}
.done-list .k{font-size:.82rem;color:var(--muted)}
.foot{color:#9aa1ad;font-size:.8rem;text-align:center;margin-top:18px}
@media(prefers-reduced-motion:no-preference){.btn,.cat,.book{transition:background .12s,border-color .12s}}
</style>
</head>

/* ==========================================================================
   4. 추천 로직 (화면과 분리 — 테스트 가능)
   ========================================================================== */
var LEVEL_LABEL = ['', '쉬움', '보통', '도전'];
var BOOK_BY_ID = {};
BOOKS.forEach(function (b) { BOOK_BY_ID[b.id] = b; });
var CAT_BY_ID = {};
CATEGORIES.forEach(function (c) { CAT_BY_ID[c.id] = c; });

function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/[\s·.,!?'"“”‘’~\-_/()\[\]]/g, ''); }

function hash(str) {            // FNV-1a — 같은 학생은 항상 같은 추천, 학생마다 조금씩 다른 순서
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/** 학년(1~3) + 읽기 선택(easy|normal|hard) → 목표 난이도(1~3) */
function targetLevel(grade, pref) {
  var base = Math.min(3, Math.max(1, Number(grade) || 2));
  var d = pref === 'easy' ? -1 : pref === 'hard' ? 1 : 0;
  return Math.min(3, Math.max(1, base + d));
}

function scoreBook(book, q) {
  var best = 0, i, nk;
  for (i = 0; i < book.k.length; i++) {
    nk = norm(book.k[i]);
    if (nk === q) return 3;
    if (q.length >= 2 && nk.length >= 2 && (nk.indexOf(q) >= 0 || q.indexOf(nk) >= 0)) best = Math.max(best, 2);
  }
  if (q.length >= 2 && norm(book.t).indexOf(q) >= 0) best = Math.max(best, 2);
  return best;
}

function guessCategory(q) {
  var best = null, bestLen = 0;
  Object.keys(SYNONYMS).forEach(function (cat) {
    SYNONYMS[cat].forEach(function (w) {
      var nw = norm(w), len = 0;
      if (nw === q) len = 100 + nw.length;
      else if (q.length >= 2 && nw.length >= 2 && (q.indexOf(nw) >= 0 || nw.indexOf(q) >= 0)) len = Math.min(nw.length, q.length);
      if (len > bestLen) { best = cat; bestLen = len; }
    });
  });
  return best;
}

/** 직접 입력 키워드 해석: 도서 태그 일치 → 분야 추정 → 모름(학생이 가까운 분야를 고름) */
function resolveCustom(raw) {
  var q = norm(raw);
  if (!q) return { status: 'invalid' };
  var matches = [];
  BOOKS.forEach(function (b) { var s = scoreBook(b, q); if (s >= 2) matches.push({ id: b.id, s: s }); });
  if (matches.length) return { status: 'matched', matchIds: matches };
  var cat = guessCategory(q);
  if (cat) return { status: 'category', cat: cat };
  return { status: 'unknown' };
}

/** 키워드가 속한 대표 분야(시트 기록용) */
function keywordCat(kw) {
  if (kw.cat) return kw.cat;
  if (kw.matchIds && kw.matchIds.length) {
    var count = {}, top = null;
    kw.matchIds.forEach(function (m) { var c = BOOK_BY_ID[m.id].c[0]; count[c] = (count[c] || 0) + 1; });
    Object.keys(count).forEach(function (c) { if (top === null || count[c] > count[top]) top = c; });
    return top;
  }
  return null;
}

/**
 * 키워드 하나에 대해 책 N권 추천.
 * kw: {type:'category', cat} | {type:'custom', status:'matched', matchIds} | {type:'custom', status:'category', cat}
 * used: 이미 다른 키워드에서 추천한 책 id 집합(가능하면 중복 제외)
 */
function recommend(kw, target, used, seed) {
  var N = CONFIG.PER_KEYWORD, pool = {};
  function add(b, score, related) { if (!pool[b.id]) pool[b.id] = { book: b, score: score, related: related }; }

  if (kw.type === 'category') {
    BOOKS.forEach(function (b) { if (b.c.indexOf(kw.cat) >= 0) add(b, 0, false); });
  } else if (kw.status === 'matched') {
    kw.matchIds.forEach(function (m) { add(BOOK_BY_ID[m.id], m.s, false); });
    if (Object.keys(pool).length < N) {                 // 부족하면 같은 분야에서 '비슷한 분야'로 채움
      var cat = keywordCat(kw);
      BOOKS.forEach(function (b) { if (b.c.indexOf(cat) >= 0) add(b, 0, true); });
    }
  } else {                                              // category 로 추정/선택된 직접 키워드
    BOOKS.forEach(function (b) { if (b.c.indexOf(kw.cat) >= 0) add(b, 0, true); });
  }

  var arr = Object.keys(pool).map(function (id) {
    var x = pool[id];
    return { book: x.book, score: x.score, related: x.related,
             d: Math.abs(x.book.l - target), h: hash(seed + '|' + id) };
  });
  arr.sort(function (x, y) {
    return (x.related - y.related) || (x.d - y.d) || (y.score - x.score) ||
           (x.book.l - y.book.l) || (x.h - y.h);        // 같은 거리면 더 쉬운 책 먼저
  });
  var fresh = arr.filter(function (x) { return !used[x.book.id]; });
  var chosen = fresh.slice(0, N);
  if (chosen.length < N) chosen = chosen.concat(arr.filter(function (x) { return used[x.book.id]; }).slice(0, N - chosen.length));
  return chosen.map(function (x) {
    return { book: x.book, related: x.related,
             fit: x.book.l === target ? 'match' : (x.book.l < target ? 'easy' : 'hard') };
  });
}

/* ==========================================================================
   4. 예스24 검색 결과 → 추천  (검색은 Apps Script가 대신 호출 → 이 파일에는 API 키가 없습니다)
      doc 형식(Code.gs가 맞춰서 보내 줌): {t,sub,a,p,date,pages,isbn,img,url,price,sales,rating,reviews,desc,rank,soldOut}
   ========================================================================== */
var EXCLUDE_RE = /문제집|참고서|수험서|자격증|기출|모의고사|워크북|N제|내신|수능|문제풀이|학습지|단어장|스티커|색칠|컬러링|유아|영유아|그림책|동화|소설|시집|에세이|희곡|전집|세트/;
var ADULT_RE = /육아|임신|직장인|퇴사|재테크|부동산|노후|중년|부모|엄마|아빠|교사|선생님을 위한|창업|CEO|연봉|면접/;
var YOUTH_RE = /청소년|10대|십대|틴에이저|중학생|중등|중고등|쫌 아는/;
var KID_RE = /어린이|초등|꼬마|저학년|고학년|\d세/;
var EASY_RE = /만화|웹툰|그림으로|처음|쉽게|쉬운|첫걸음|술술|놀이|퀴즈/;
var HARD_RE = /이론|원리|철학|사상|비판|해석|논리|체계|구조|패러다임|고전|개론|심화|담론|성찰/;
var DOC_CACHE = {};

function digits(s) { return String(s == null ? '' : s).replace(/[^0-9Xx]/g, ''); }
function toNum(v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function parseDate(s) {
  var m = String(s == null ? '' : s).match(/(\d{4})\D?(\d{1,2})?\D?(\d{1,2})?/);
  return m ? new Date(Date.UTC(+m[1], (+m[2] || 1) - 1, +m[3] || 1)) : null;
}
function safeImg(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u.replace(/^http:/i, 'https:') : ''; }
function yes24Url(b) {
  if (b.url && /^https?:\/\/([a-z0-9-]+\.)*yes24\.com\//i.test(b.url)) return b.url;
  return 'https://www.yes24.com/Product/Search?domain=BOOK&query=' + encodeURIComponent(b.isbn || b.t);
}

/** 예스24 doc → 화면용 책 객체(쓸 수 없으면 null) */
function normalizeDoc(d, now) {
  if (!d) return null;
  var t = String(d.t || '').trim().slice(0, 120);
  if (!t) return null;
  var isbn = digits(d.isbn), dt = parseDate(d.date);
  var b = {
    id: isbn ? 'b' + isbn : 'h' + hash(t + '|' + (d.a || '')),
    t: t, sub: String(d.sub || '').slice(0, 120), a: String(d.a || '').slice(0, 60), p: String(d.p || '').slice(0, 40),
    isbn: isbn, img: safeImg(d.img), date: dt ? dt.toISOString().slice(0, 10) : '', pages: toNum(d.pages),
    price: toNum(d.price), sales: toNum(d.sales), rating: toNum(d.rating), reviews: toNum(d.reviews),
    desc: String(d.desc || '').slice(0, 200), rank: toNum(d.rank), soldOut: !!d.soldOut, src: 'yes24'
  };
  b.age = dt ? ((now || Date.now()) - dt.getTime()) / 31557600000 : null;
  b.url = yes24Url({ url: d.url, isbn: isbn, t: t });
  b.youth = YOUTH_RE.test(t + ' ' + b.sub + ' ' + b.desc);
  b.l = estimateLevel(b);
  return b;
}

/** 읽기 난이도 추정(1~3): 대상 독자 표시, 제목 단서, 쪽수(없으면 정가)를 종합한 '추정치'입니다. */
function estimateLevel(b) {
  var head = b.t + ' ' + b.sub, all = head + ' ' + b.desc, x = 0, kid = KID_RE.test(all);
  if (kid) x -= 2;
  else if (!b.youth) x += 1;                           // 청소년 대상이라고 밝히지 않은 일반 교양서는 한 단계 위
  if (EASY_RE.test(head)) x -= 1;
  if (HARD_RE.test(head)) x += 1;
  if (b.pages) { if (b.pages <= 150) x -= 1; else if (b.pages >= 450) x += 2; else if (b.pages >= 320) x += 1; }
  else if (b.price >= 20000) x += 1;
  return Math.min(3, Math.max(1, 2 + x));
}

function okBook(b) {
  var txt = b.t + ' ' + b.sub;
  if (b.soldOut || EXCLUDE_RE.test(txt)) return false;
  if (ADULT_RE.test(txt + ' ' + b.desc) && !b.youth) return false;
  return true;
}

function percentile(list, v) {                          // 0~1 (값의 단위를 몰라도 되도록 후보들 사이의 순위로 환산)
  if (list.length < 2) return 0.5;
  var below = 0; list.forEach(function (x) { if (x < v) below++; });
  return below / (list.length - 1);
}

function reasonText(b, kw, q, catName) {
  var parts = [];
  if (q && norm(b.t).indexOf(q) >= 0) parts.push('제목에 ‘' + kw.label + '’ 키워드가 들어 있어요.');
  else if (q && norm(b.sub + ' ' + b.desc).indexOf(q) >= 0) parts.push('책 소개에 ‘' + kw.label + '’ 이야기가 나와요.');
  else parts.push('‘' + (q ? kw.label : catName) + '’ 검색에서 찾은 책이에요.');
  if (b.youth) parts.push('청소년 대상 책이에요.');
  if (b.age !== null && b.age <= 3) parts.push('최근에 나왔어요.');
  return parts.join(' ');
}

/**
 * 예스24 검색 결과(docs)에서 N권 추천. 결과가 모자라면 선생님이 정한 목록(BOOKS)으로 채움.
 * docs 가 null 이면(연결 실패·테스트 모드) 전부 선생님 목록.
 */
function recommendOnline(kw, docs, target, used, seed, now) {
  var N = CONFIG.PER_KEYWORD, q = kw.type === 'custom' ? norm(kw.label) : '';
  var cat = keywordCat(kw), catName = cat ? CAT_BY_ID[cat].name : '', seen = {}, cands = [];
  (docs || []).forEach(function (d) {
    var b = normalizeDoc(d, now);
    if (!b || !okBook(b)) return;
    var k1 = b.isbn || b.id, k2 = 't:' + norm(b.t);
    if (seen[k1] || seen[k2]) return;
    seen[k1] = seen[k2] = 1; cands.push(b);
  });
  var sales = cands.map(function (b) { return b.sales; }), rev = cands.map(function (b) { return b.reviews; });
  var ranks = cands.map(function (b) { return -b.rank; });
  var scored = cands.map(function (b) {
    var s = 0, nt = norm(b.t);
    if (q && nt.indexOf(q) >= 0) s += 4; else if (q && norm(b.sub + ' ' + b.desc).indexOf(q) >= 0) s += 2;
    if (b.youth) s += 2;
    if (b.age !== null) s += b.age <= 3 ? 1.5 : b.age <= 5 ? 1 : b.age >= 10 ? -1 : 0;
    var r5 = b.rating > 5 ? b.rating / 2 : b.rating;                   // 5점·10점 만점 모두 대응
    if (r5) s += r5 >= 4.5 ? 1 : r5 >= 4 ? 0.5 : r5 <= 3 ? -1 : 0;
    if (b.sales) s += percentile(sales, b.sales) * 1.5; else if (b.reviews) s += percentile(rev, b.reviews);
    if (b.rank) s += percentile(ranks, -b.rank) * 1;                   // 검색 결과 앞쪽일수록 가산
    s -= 1.5 * Math.abs(b.l - target);
    return { book: b, s: s, h: hash(seed + '|' + b.id) };
  });
  scored.sort(function (x, y) { return (y.s - x.s) || (x.h - y.h); });
  var picks = scored.filter(function (x) { return !used[x.book.id]; }).slice(0, N);
  if (picks.length < N) picks = picks.concat(scored.filter(function (x) { return used[x.book.id]; }).slice(0, N - picks.length));
  var out = picks.map(function (x) {
    return { book: x.book, related: false, fill: false, reason: reasonText(x.book, kw, q, catName),
             fit: x.book.l === target ? 'match' : (x.book.l < target ? 'easy' : 'hard') };
  });
  if (out.length < N) {                                                // 모자란 만큼 선생님 목록으로 채움
    var have = {}; out.forEach(function (o) { have['t:' + norm(o.book.t)] = 1; });
    var u2 = {}; Object.keys(used).forEach(function (k) { u2[k] = 1; });
    recommend(kw, target, u2, seed).forEach(function (r) {
      if (out.length >= N || have['t:' + norm(r.book.t)]) return;
      var lb = { id: r.book.id, t: r.book.t, sub: '', a: r.book.a, p: r.book.p, l: r.book.l, isbn: '', img: '', date: '', pages: 0, age: null, youth: false, src: 'local' };
      lb.url = yes24Url({ t: lb.t });
      out.push({ book: lb, related: r.related, fill: true, fit: r.fit,
                 reason: '선생님이 정해 둔 목록에서 골랐어요.' });
    });
  }
  return out;
}

function queriesFor(kw) {
  if (kw.type === 'category') return CAT_BY_ID[kw.cat].q.slice();
  var l = String(kw.label).replace(/[|\s]+/g, ' ').trim();
  return [l + ' 청소년', l + ' 10대', l];
}

/** Apps Script(예스24 검색 대행)에 요청. 실패하면 null → 선생님 목록으로 대체 */
function fetchDocs(kw) {
  if (!CONFIG.APPS_SCRIPT_URL || typeof fetch === 'undefined') return Promise.resolve(null);
  var qs = queriesFor(kw), key = qs.join('|');
  if (DOC_CACHE[key]) return Promise.resolve(DOC_CACHE[key]);
  var url = CONFIG.APPS_SCRIPT_URL + (CONFIG.APPS_SCRIPT_URL.indexOf('?') >= 0 ? '&' : '?') + 'action=search&q=' + encodeURIComponent(key);
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, CONFIG.SEARCH_TIMEOUT_MS) : null;
  return fetch(url, { signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (timer) clearTimeout(timer);
      if (!j || !j.ok || !Array.isArray(j.docs)) throw new Error((j && j.error) || '검색 실패');
      DOC_CACHE[key] = j.docs; return j.docs;
    })
    .catch(function (e) { if (timer) clearTimeout(timer); if (typeof console !== 'undefined') console.warn('[예스24 검색 실패]', e && e.message ? e.message : e); return null; });
}

var api = { CONFIG: CONFIG, CATEGORIES: CATEGORIES, BOOKS: BOOKS, LEVEL_LABEL: LEVEL_LABEL,
            norm: norm, targetLevel: targetLevel, resolveCustom: resolveCustom,
            guessCategory: guessCategory, keywordCat: keywordCat, recommend: recommend,
            normalizeDoc: normalizeDoc, estimateLevel: estimateLevel, okBook: okBook, recommendOnline: recommendOnline,
            queriesFor: queriesFor, fetchDocs: fetchDocs, yes24Url: yes24Url };
if (typeof module !== 'undefined' && module.exports) { module.exports = api; }

   5. 화면
   ========================================================================== */
if (typeof document === 'undefined') { return; }

var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var app = document.getElementById('app');
var uid = 0;
var S = {
  step: 0,                                   // 0 정보 · 1 분야 · 2 키워드 추가 · 3 책 고르기 · 4 완료
  student: { grade: null, cls: '', num: '', name: '' },
  pref: 'normal',
  cats: [],                                  // 고른 분야 id
  customs: [],                               // {id,label,status,cat?,matchIds?}
  recs: {},                                  // kwId → 추천 목록
  kws: [],
  choices: {},                               // kwId → bookId
  error: '', submitting: false, result: null,
  loading: false, offline: false, req: 0
};

function target() { return targetLevel(S.student.grade, S.pref); }
function seed() { return [S.student.grade, S.student.cls, S.student.num].join('-'); }

function keywordList() {
  var list = S.cats.map(function (id) { return { id: 'cat:' + id, label: CAT_BY_ID[id].name, type: 'category', cat: id }; });
  S.customs.forEach(function (c) {
    list.push({ id: 'custom:' + c.id, label: c.label, type: 'custom', status: c.status, cat: c.cat, matchIds: c.matchIds });
  });
  return list;
}

function buildRecs() {
  var kws = keywordList(), t = target(), sd = seed(), req = ++S.req;
  S.loading = true; S.error = ''; S.step = 3; render();
  return Promise.all(kws.map(fetchDocs)).then(function (all) {
    if (req !== S.req) return;                          // 그 사이 '이전'을 눌렀다면 결과를 버림
    var used = {}, recs = {}, now = Date.now();
    kws.forEach(function (kw, i) {
      var r = recommendOnline(kw, all[i], t, used, sd, now);
      r.forEach(function (x) { used[x.book.id] = true; });
      recs[kw.id] = r;
    });
    var kept = {};
    kws.forEach(function (kw) {
      var id = S.choices[kw.id];
      if (id && recs[kw.id].some(function (x) { return x.book.id === id; })) kept[kw.id] = id;
    });
    S.kws = kws; S.recs = recs; S.choices = kept;
    S.offline = !!CONFIG.APPS_SCRIPT_URL && all.every(function (x) { return x === null; });
    S.loading = false; lastStep = -1; render();
  });
}

/* ---------- 공통 조각 ---------- */
function stepper(cur) {
  var labels = ['내 정보', '관심 분야', '키워드 추가', '책 고르기'];
  return '<ol class="stepper" aria-label="진행 단계">' + labels.map(function (l, i) {
    return '<li class="' + (i === cur ? 'on' : i < cur ? 'done' : '') + '"' + (i === cur ? ' aria-current="step"' : '') + '><span>' + (i + 1) + '</span>' + l + '</li>';
  }).join('') + '</ol>';
}
function banner() {
  return CONFIG.APPS_SCRIPT_URL ? '' : '<div class="banner">🧪 테스트 모드예요. 제출해도 스프레드시트에는 저장되지 않아요. (선생님: index.html의 APPS_SCRIPT_URL을 설정하세요)</div>';
}
function errBox() { return S.error ? '<div class="error" role="alert">' + esc(S.error) + '</div>' : ''; }
function stars(l) { return '★'.repeat(l) + '☆'.repeat(3 - l); }

/* ---------- 0. 내 정보 ---------- */
function viewIntro() {
  var st = S.student;
  function seg(v) { return '<button type="button" data-act="grade" data-v="' + v + '" aria-pressed="' + (st.grade === v) + '">중학교 ' + v + '학년</button>'; }
  function opt(v, t, s) { return '<button type="button" class="opt" data-act="pref" data-v="' + v + '" aria-pressed="' + (S.pref === v) + '">' + t + '<small>' + s + '</small></button>'; }
  return banner() + stepper(0) + '<section class="card">' +
    '<h1 tabindex="-1">나에게 맞는 비문학 책 찾기</h1>' +
    '<p class="lead">비문학은 이야기가 아니라 <b>지식·정보·생각</b>을 담은 책이에요. 관심 있는 분야를 고르면 내 읽기 수준에 맞는 책을 3권씩 보여 줄게요. 그중 한 권을 골라 보세요!</p>' + errBox() +
    '<div class="field"><span class="lab">학년</span><div class="seg" role="group" aria-label="학년">' + seg(1) + seg(2) + seg(3) + '</div></div>' +
    '<div class="row field"><div><label for="f-cls">반</label><input id="f-cls" type="number" inputmode="numeric" min="1" max="99" value="' + esc(st.cls) + '" placeholder="예: 3"></div>' +
    '<div><label for="f-num">번호</label><input id="f-num" type="number" inputmode="numeric" min="1" max="99" value="' + esc(st.num) + '" placeholder="예: 12"></div></div>' +
    '<div class="field"><label for="f-name">이름</label><input id="f-name" type="text" maxlength="20" autocomplete="off" value="' + esc(st.name) + '" placeholder="이름을 써 주세요"></div>' +
    '<div class="field"><span class="lab">어떤 책부터 볼까요?</span><div class="opts">' +
      opt('easy', '조금 쉬운 책부터', '처음이라 부담스러워요') +
      opt('normal', '내 학년에 알맞은 책', '보통은 이걸 추천해요') +
      opt('hard', '조금 도전해 볼래요', '읽어 본 경험이 많아요') + '</div></div>' +
    '<div class="actions"><button class="btn primary" type="button" data-act="start">시작하기</button></div></section>';
}

/* ---------- 1. 관심 분야 ---------- */
function viewCats() {
  var full = S.cats.length >= CONFIG.MAX_CATS;
  var cards = CATEGORIES.map(function (c) {
    var on = S.cats.indexOf(c.id) >= 0;
    return '<button type="button" class="cat" data-act="cat" data-v="' + c.id + '" aria-pressed="' + on + '"' + (!on && full ? ' aria-disabled="true"' : '') + '>' +
      '<span class="kd">' + c.kdc + '</span><span class="ic" aria-hidden="true">' + c.icon + '</span><span class="nm">' + c.name + '</span><span class="hn">' + c.hint + '</span></button>';
  }).join('');
  return banner() + stepper(1) + '<section class="card"><h2 tabindex="-1">끌리는 분야를 골라 보세요</h2>' +
    '<p class="hint">최대 ' + CONFIG.MAX_CATS + '개까지 고를 수 있어요. <span class="counter">' + S.cats.length + '/' + CONFIG.MAX_CATS + '</span></p>' + errBox() +
    '<div class="cats">' + cards + '</div>' +
    '<p class="hint" style="margin-top:12px">분야는 도서관에서 쓰는 한국십진분류표(KDC)를 참고했어요. 소설·시 같은 문학은 이번 활동에서 제외했어요.</p>' +
    '<div class="actions"><button class="btn ghost" type="button" data-act="back">이전</button>' +
    '<button class="btn primary" type="button" data-act="to-custom"' + (S.cats.length ? '' : ' disabled') + '>다음</button></div></section>';
}

/* ---------- 2. 키워드 직접 추가 ---------- */
function viewCustom() {
  var hasUnknown = S.customs.some(function (c) { return c.status === 'unknown'; });
  var tags = S.customs.length ? '<div class="tags">' + S.customs.map(function (c) {
    return '<span class="tag">' + esc(c.label) + '<button type="button" data-act="rm" data-v="' + c.id + '" aria-label="' + esc(c.label) + ' 지우기">×</button></span>';
  }).join('') + '</div>' : '';
  var notes = S.customs.map(function (c) {
    if (c.status === 'matched') return '<p class="kwnote">✔ ‘' + esc(c.label) + '’와 관련된 책을 찾았어요.</p>';
    if (c.status === 'category') return '<p class="kwnote warn">‘' + esc(c.label) + '’는 <b>' + CAT_BY_ID[c.cat].name + '</b> 분야에서 비슷한 책을 찾아볼게요.</p>';
    return '<div class="kwrow"><label for="pk-' + c.id + '"><b>‘' + esc(c.label) + '’</b>와 가장 가까운 분야는 어디일까요?</label>' +
      '<select id="pk-' + c.id + '" data-act="pick-cat" data-id="' + c.id + '"><option value="">분야 고르기</option>' +
      CATEGORIES.map(function (x) { return '<option value="' + x.id + '">' + x.name + '</option>'; }).join('') + '</select></div>';
  }).join('');
  var eg = ['축구', 'K팝', '로봇', '우주', '요리', '게임'].filter(function (w) {
    return !S.customs.some(function (c) { return c.label === w; });
  }).map(function (w) { return '<button type="button" class="chip" data-act="eg" data-v="' + w + '">+ ' + w + '</button>'; }).join('');
  var canAdd = S.customs.length < CONFIG.MAX_CUSTOM;
  return banner() + stepper(2) + '<section class="card"><h2 tabindex="-1">관심 키워드를 더 추가해 볼까요?</h2>' +
    '<p class="hint">고른 분야 말고도 궁금한 게 있다면 직접 써 보세요. 없으면 그냥 넘어가도 돼요. (최대 ' + CONFIG.MAX_CUSTOM + '개)</p>' + errBox() +
    '<div class="field"><label for="f-kw">나만의 키워드</label><div class="row"><input id="f-kw" type="text" maxlength="20" autocomplete="off" placeholder="예: 블랙홀, 아이돌, 축구" ' + (canAdd ? '' : 'disabled') + '>' +
    '<button class="btn" type="button" data-act="add" style="flex:none"' + (canAdd ? '' : ' disabled') + '>추가</button></div></div>' +
    (canAdd ? '<div>' + eg + '</div>' : '') + tags + notes +
    '<div class="actions"><button class="btn ghost" type="button" data-act="back">이전</button>' +
    '<button class="btn primary" type="button" data-act="to-recs"' + (hasUnknown ? ' disabled' : '') + '>' + (S.customs.length ? '책 추천 받기' : '건너뛰고 책 추천 받기') + '</button></div></section>';
}

/* ---------- 3. 책 고르기 ---------- */
function viewLoading() {
  return banner() + stepper(3) + '<section class="card" role="status"><h2 tabindex="-1">책을 찾고 있어요…</h2>' +
    '<p class="hint">고른 키워드에 맞는 책을 예스24에서 찾는 중이에요. 몇 초만 기다려 주세요.</p><div class="spin" aria-hidden="true"></div></section>';
}
function viewRecs() {
  var done = S.kws.filter(function (k) { return S.choices[k.id]; }).length, total = S.kws.length;
  var fitText = { match: '내 수준에 딱 맞아요', easy: '조금 쉬워요', hard: '조금 도전이에요' };
  var anyFill = S.kws.some(function (k) { return S.recs[k.id].some(function (r) { return r.fill; }); });
  var note = S.offline ? '<div class="banner">예스24 검색에 연결하지 못해 선생님이 정한 목록에서 골랐어요.</div>'
    : anyFill ? '<div class="banner">일부 키워드는 검색된 책이 모자라 선생님이 정한 목록으로 채웠어요.</div>' : '';
  var secs = S.kws.map(function (kw) {
    var c = keywordCat(kw), catName = c ? CAT_BY_ID[c].name : '';
    var books = S.recs[kw.id].map(function (r) {
      var b = r.book, checked = S.choices[kw.id] === b.id;
      var cover = b.img ? '<img class="cover" src="' + esc(b.img) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '<span class="cover ph" aria-hidden="true">📘</span>';
      var sub = [b.date ? b.date.replace(/-/g, '.') : '', b.pages ? b.pages + '쪽' : '', b.isbn ? 'ISBN ' + b.isbn : ''].filter(Boolean).join(' · ');
      return '<label class="book"><input type="radio" name="pick-' + esc(kw.id) + '" value="' + esc(b.id) + '" data-act="choose" data-kw="' + esc(kw.id) + '" data-v="' + esc(b.id) + '"' + (checked ? ' checked' : '') + '>' + cover +
        '<span class="tx"><span class="book-title" style="display:block">' + esc(b.t) + '</span>' +
        (b.sub ? '<span class="book-meta" style="display:block">' + esc(b.sub) + '</span>' : '') +
        '<span class="book-meta" style="display:block">' + esc([b.a, b.p].filter(Boolean).join(' · ') || '\u00a0') + '</span>' +
        (sub ? '<span class="book-meta" style="display:block;font-size:.8rem">' + esc(sub) + '</span>' : '') +
        '<span class="chips"><span class="lv' + b.l + '">난이도 ' + stars(b.l) + ' ' + LEVEL_LABEL[b.l] + '</span><span class="fit">' + fitText[r.fit] + '</span>' +
        (b.age !== null && b.age <= 3 ? '<span class="new">최근 출간</span>' : '') + (b.youth ? '<span class="yt">청소년 대상</span>' : '') +
        (b.src === 'local' ? '<span class="tch">선생님 목록</span>' : '') + (r.related ? '<span class="rel">비슷한 분야</span>' : '') + '</span>' +
        (r.reason ? '<span class="why">' + esc(r.reason) + '</span>' : '') +
        '<a class="y24" href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer">예스24에서 보기 ↗</a></span></label>';
    }).join('');
    return '<section class="card"><div class="kw-head"><span class="k">🔑 ' + esc(kw.label) + '</span>' +
      (kw.type === 'custom' && catName ? '<span class="c">' + esc(catName) + ' 분야</span>' : '') + '</div>' +
      '<p class="hint" style="margin:0 0 10px">이 키워드에서 읽고 싶은 책을 <b>한 권</b> 골라 보세요.</p>' + books + '</section>';
  }).join('');
  return banner() + stepper(3) + note + '<h2 tabindex="-1" style="margin:4px 4px 10px">추천 도서에서 한 권씩 골라요</h2>' + errBox() + secs +
    '<div class="actions" style="margin-bottom:6px"><button class="btn ghost" type="button" data-act="back">이전</button></div>' +
    '<div class="bar"><div class="bar-in"><div class="msg"><span class="counter" id="prog">' + done + '/' + total + '</span> 권 선택했어요</div>' +
    '<button class="btn primary" type="button" id="btn-submit" data-act="submit"' + (done === total && !S.submitting ? '' : ' disabled') + '>' + (S.submitting ? '제출 중…' : '제출하기') + '</button></div></div>';
}

/* ---------- 4. 완료 ---------- */
function viewDone() {
  var items = S.kws.map(function (kw) {
    var r = S.recs[kw.id].filter(function (x) { return x.book.id === S.choices[kw.id]; })[0];
    return r ? '<li><div class="k">🔑 ' + esc(kw.label) + '</div><b>' + esc(r.book.t) + '</b><div class="book-meta">' + esc([r.book.a, r.book.p].filter(Boolean).join(' · ')) + '</div><a class="y24" href="' + esc(r.book.url) + '" target="_blank" rel="noopener noreferrer">예스24에서 보기 ↗</a></li>' : '';
  }).join('');
  var local = S.result && S.result.local ? '<p class="hint">🧪 테스트 모드: 시트에는 저장되지 않았어요.</p>' : '';
  return banner() + '<section class="card"><h1 tabindex="-1">제출했어요! 🎉</h1><p class="lead">' + esc(S.student.name) + ' 학생이 고른 책이에요. 도서관이나 서점에서 찾아 읽어 보세요.</p>' +
    '<ul class="done-list">' + items + '</ul>' + local +
    '<div class="actions"><button class="btn" type="button" data-act="restart">처음으로</button></div></section>';
}

/* ---------- 렌더 / 이벤트 ---------- */
var lastStep = -1;
function render() {
  var active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset : null;
  var html = S.step === 0 ? viewIntro() : S.step === 1 ? viewCats() : S.step === 2 ? viewCustom() : S.step === 3 ? (S.loading ? viewLoading() : viewRecs()) : viewDone();
  app.innerHTML = html + '<p class="foot">비문학 책 추천 · 도서 정보: 예스24 · 읽기 수준은 책 정보를 바탕으로 한 추정이에요</p>';
  if (S.step !== lastStep) {
    lastStep = S.step;
    if (typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
    var h = app.querySelector && app.querySelector('h1,h2');
    if (h && h.focus) h.focus();
  } else if (active && active.act && app.querySelector) {   // 같은 화면 안에서는 포커스 유지
    var sel = '[data-act="' + active.act + '"]' + (active.v ? '[data-v="' + active.v + '"]' : '');
    var el = app.querySelector(sel);
    if (el && el.focus) el.focus();
  }
}

function syncIntro() {
  var g = function (id) { var e = document.getElementById(id); return e ? e.value : ''; };
  S.student.cls = g('f-cls'); S.student.num = g('f-num'); S.student.name = g('f-name');
}
function fail(msg) { S.error = msg; render(); }

function startNext() {
  var st = S.student, cls = parseInt(st.cls, 10), num = parseInt(st.num, 10), name = String(st.name || '').trim();
  if (!st.grade) return fail('학년을 골라 주세요.');
  if (!(cls >= 1 && cls <= 99)) return fail('반을 숫자로 써 주세요.');
  if (!(num >= 1 && num <= 99)) return fail('번호를 숫자로 써 주세요.');
  if (!name) return fail('이름을 써 주세요.');
  st.cls = String(cls); st.num = String(num); st.name = name; S.error = ''; S.step = 1; render();
}
function toggleCat(id) {
  var i = S.cats.indexOf(id);
  if (i >= 0) { S.cats.splice(i, 1); S.error = ''; }
  else if (S.cats.length >= CONFIG.MAX_CATS) { S.error = '분야는 최대 ' + CONFIG.MAX_CATS + '개까지 고를 수 있어요. 하나를 해제하고 골라 보세요.'; }
  else { S.cats.push(id); S.error = ''; }
  render();
}
function addCustom(raw) {
  raw = String(raw == null ? (document.getElementById('f-kw') || {}).value : raw || '').trim().replace(/\s+/g, ' ');
  if (!raw) return;
  if (raw.length > 20) return fail('키워드는 20자 이내로 써 주세요.');
  if (S.customs.length >= CONFIG.MAX_CUSTOM) return fail('직접 추가는 최대 ' + CONFIG.MAX_CUSTOM + '개까지 할 수 있어요.');
  if (S.customs.some(function (c) { return norm(c.label) === norm(raw); })) return fail('이미 추가한 키워드예요.');
  var r = resolveCustom(raw);
  if (r.status === 'invalid') return fail('글자나 숫자로 된 키워드를 써 주세요.');
  var item = { id: 'c' + (++uid), label: raw, status: r.status };
  if (r.matchIds) item.matchIds = r.matchIds;
  if (r.cat) item.cat = r.cat;
  S.customs.push(item); S.error = ''; render();
}

function payload() {
  var st = S.student, prefText = { easy: '조금 쉽게', normal: '알맞게', hard: '도전' }[S.pref];
  return {
    version: 2,
    student: { grade: st.grade, cls: Number(st.cls), num: Number(st.num), name: st.name },
    levelSetting: '중' + st.grade + ' · ' + prefText + '(' + LEVEL_LABEL[target()] + ')',
    picks: S.kws.map(function (kw) {
      var recs = S.recs[kw.id], ch = recs.filter(function (r) { return r.book.id === S.choices[kw.id]; })[0].book, c = keywordCat(kw);
      return {
        keyword: kw.label, type: kw.type === 'category' ? '분야' : '직접추가',
        category: c ? CAT_BY_ID[c].name : '',
        recs: recs.map(function (r) { return r.book.t; }),
        chosen: { title: ch.t, author: ch.a, level: LEVEL_LABEL[ch.l], isbn: ch.isbn || '' }
      };
    })
  };
}

function send(data) {
  if (!CONFIG.APPS_SCRIPT_URL) {                       // 테스트 모드: 브라우저에만 임시 저장
    try {
      var key = 'bookrec_test_results', arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr.push({ at: new Date().toISOString(), data: data }); localStorage.setItem(key, JSON.stringify(arr));
    } catch (e) { /* 저장소를 못 쓰는 환경이어도 화면 흐름은 계속 */ }
    if (typeof console !== 'undefined') console.log('[테스트 모드] 제출 내용', data);
    return Promise.resolve({ ok: true, local: true });
  }
  var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 25000) : null;
  return fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // preflight 를 피하려고 text/plain 사용
    body: JSON.stringify(data), signal: ctrl ? ctrl.signal : undefined
  }).then(function (r) { return r.json(); }).then(function (j) { if (timer) clearTimeout(timer); return j; },
          function (e) { if (timer) clearTimeout(timer); throw e; });
}

function submit() {
  if (S.submitting) return;
  if (S.kws.some(function (k) { return !S.choices[k.id]; })) return fail('모든 키워드에서 책을 한 권씩 골라 주세요.');
  S.submitting = true; S.error = ''; render();
  send(payload()).then(function (res) {
    if (!res || !res.ok) throw new Error((res && res.error) || '저장 실패');
    S.result = res; S.step = 4;
  }).catch(function (e) {
    S.error = '제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. (' + (e && e.message ? e.message : e) + ')';
  }).then(function () { S.submitting = false; render(); });
}

function onClick(e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.dataset.act, v = el.dataset.v;
  if (S.step === 0) syncIntro();
  switch (act) {
    case 'grade': S.student.grade = Number(v); S.error = ''; render(); break;
    case 'pref': S.pref = v; render(); break;
    case 'start': startNext(); break;
    case 'cat': toggleCat(v); break;
    case 'to-custom': S.error = ''; S.step = 2; render(); break;
    case 'add': addCustom(); break;
    case 'eg': addCustom(v); break;
    case 'rm': S.customs = S.customs.filter(function (c) { return c.id !== v; }); S.error = ''; render(); break;
    case 'to-recs': buildRecs(); break;
    case 'back': S.req++; S.loading = false; S.error = ''; S.step = Math.max(0, S.step - 1); render(); break;
    case 'choose':                                     // 라디오는 화면 전체를 다시 그리지 않고 진행 표시만 갱신
      S.choices[el.dataset.kw] = v;
      var done = S.kws.filter(function (k) { return S.choices[k.id]; }).length;
      var p = document.getElementById('prog'), b = document.getElementById('btn-submit');
      if (p) p.textContent = done + '/' + S.kws.length;
      if (b) b.disabled = done !== S.kws.length || S.submitting;
      break;
    case 'submit': submit(); break;
    case 'restart':
      S = { step: 0, student: { grade: null, cls: '', num: '', name: '' }, pref: 'normal', cats: [], customs: [], recs: {}, kws: [], choices: {}, error: '', submitting: false, result: null, loading: false, offline: false, req: S.req + 1 };
      render(); break;
  }
}
function onChange(e) {
  var el = e.target;
  if (el && el.dataset && el.dataset.act === 'pick-cat' && el.value) {
    S.customs.forEach(function (c) { if (c.id === el.dataset.id) { c.status = 'category'; c.cat = el.value; } });
    render();
  }
}
function onKey(e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'f-kw') { e.preventDefault(); addCustom(); }
}

app.addEventListener('click', onClick);
app.addEventListener('change', onChange);
app.addEventListener('keydown', onKey);
render();

})(typeof window !== 'undefined' ? window : globalThis);
</script>
